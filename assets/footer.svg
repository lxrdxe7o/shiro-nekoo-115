<svg fill="none" viewBox="0 0 800 80" width="800" height="80" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .footer {
          font-family: 'Courier New', monospace;
          width: 800px;
          height: 80px;
          background-color: #0d0d0d;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #888;
          font-size: 14px;
          border: 1px solid #333;
          border-radius: 6px;
          position: relative;
          overflow: hidden;
        }

        .heart {
          display: inline-block;
          animation: heartbeat 1.5s ease-in-out infinite;
          margin: 0 5px;
          font-size: 18px;
        }

        @keyframes heartbeat {
          0% { transform: scale(1); }
          14% { transform: scale(1.3); }
          28% { transform: scale(1); }
          42% { transform: scale(1.3); }
          70% { transform: scale(1); }
        }

        .author {
          font-weight: bold;
          background: linear-gradient(90deg, #FFFF00, #ff69b4, #00ff00, #9d8cff);
          background-size: 300% 300%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          animation: rainbow 5s ease infinite;
          text-decoration: none;
        }

        @keyframes rainbow { 
          0%{background-position:0% 50%}
          50%{background-position:100% 50%}
          100%{background-position:0% 50%}
        }
        
        .username {
          opacity: 0.6;
          font-size: 12px;
          margin-left: 8px;
        }
      </style>
      <div class="footer">
        <span>made with </span>
        <span class="heart">💖</span>
        <span> by </span>
        <span class="author" style="margin-left: 5px;">xero</span>
        <span class="username">(github: lxrdxe7o)</span>
      </div>
    </div>
  </foreignObject>
</svg>
