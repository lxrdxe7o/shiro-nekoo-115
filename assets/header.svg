<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    
    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFF00"/>
      <stop offset="25%" style="stop-color:#9d8cff"/>
      <stop offset="50%" style="stop-color:#00ff00"/>
      <stop offset="75%" style="stop-color:#ff69b4"/>
      <stop offset="100%" style="stop-color:#FFFF00"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="6"/>
  
  <!-- Scanlines effect -->
  <pattern id="scanlines" patternUnits="userSpaceOnUse" width="100%" height="4">
    <rect width="100%" height="2" fill="transparent"/>
    <rect y="2" width="100%" height="2" fill="rgba(0,0,0,0.15)"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#scanlines)" opacity="0.5"/>
  
  <!-- Main Title -->
  <text x="400" y="95" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="url(#titleGrad)" filter="url(#glow)">
    NEKO'S HMS
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4s" repeatCount="indefinite"/>
  </text>
  
  <!-- Subtitle pills -->
  <g font-family="monospace" font-size="12" font-weight="bold">
    <!-- Hospital pill -->
    <rect x="195" y="130" width="80" height="28" rx="4" fill="rgba(0,0,0,0.4)" stroke="#FFFF00" stroke-width="1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="235" y="149" text-anchor="middle" fill="#FFFF00">HOSPITAL</text>
    
    <!-- Patients pill -->
    <rect x="290" y="130" width="80" height="28" rx="4" fill="rgba(0,0,0,0.4)" stroke="#9d8cff" stroke-width="1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    <text x="330" y="149" text-anchor="middle" fill="#9d8cff">PATIENTS</text>
    
    <!-- Doctors pill -->
    <rect x="385" y="130" width="80" height="28" rx="4" fill="rgba(0,0,0,0.4)" stroke="#00ff00" stroke-width="1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <text x="425" y="149" text-anchor="middle" fill="#00ff00">DOCTORS</text>
    
    <!-- Wards pill -->
    <rect x="480" y="130" width="70" height="28" rx="4" fill="rgba(0,0,0,0.4)" stroke="#ff69b4" stroke-width="1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
    <text x="515" y="149" text-anchor="middle" fill="#ff69b4">WARDS</text>
  </g>
</svg>
