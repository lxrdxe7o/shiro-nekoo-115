<svg fill="none" viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
        @keyframes wave {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
        .container {
          font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          width: 800px;
          height: 200px;
          background: linear-gradient(135deg, #0f3d0f 0%, #001a00 100%);
          position: relative;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          border-radius: 4px;
        }
        .grid-overlay {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-image: 
            linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
          background-size: 20px 20px;
          z-index: 1;
        }
        .content {
          z-index: 10;
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .icon {
          width: 50px;
          height: 50px;
          margin-bottom: 15px;
          animation: float 6s ease-in-out infinite;
          filter: drop-shadow(0 0 10px rgba(0, 255, 85, 0.6));
        }
        h1 {
          margin: 0;
          font-size: 42px;
          font-weight: 800;
          letter-spacing: -1px;
          background: linear-gradient(to right, #ffffff, #80ffaa);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        p {
          margin: 10px 0 0;
          font-size: 16px;
          color: #a3ffc7;
          font-family: 'Courier New', monospace;
          letter-spacing: 1px;
          opacity: 0.9;
        }
        .waves {
          position: absolute;
          bottom: 0;
          left: 0;
          width: 200%;
          height: 60px;
          z-index: 2;
          opacity: 0.4;
        }
        .wave-path {
          fill: #00ff55;
        }
      </style>
      <div class="container">
        <div class="grid-overlay"></div>
        <div class="content">
          <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3Z" stroke="#00ff55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 8V16" stroke="#00ff55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 12H16" stroke="#00ff55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1>HMS CORE</h1>
          <p>MODULAR . SECURE . C11</p>
        </div>
        <div class="waves">
          <svg viewBox="0 0 1600 200" width="1600" height="200" preserveAspectRatio="none" style="width: 100%; height: 100%;">
             <path class="wave-path" d="M0,100 C200,150 400,50 600,100 C800,150 1000,50 1200,100 C1400,150 1600,50 1800,100 L1800,200 L0,200 Z" style="animation: wave 20s linear infinite;">
               <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="20s" repeatCount="indefinite" />
             </path>
          </svg>
        </div>
        <div class="waves" style="bottom: -10px; opacity: 0.2; transform: scaleY(0.7);">
          <svg viewBox="0 0 1600 200" width="1600" height="200" preserveAspectRatio="none" style="width: 100%; height: 100%;">
             <path class="wave-path" d="M0,100 C300,50 500,150 800,100 C1100,50 1300,150 1600,100 L1600,200 L0,200 Z">
               <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="15s" repeatCount="indefinite" />
             </path>
          </svg>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
