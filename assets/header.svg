<svg fill="none" viewBox="0 0 800 200" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: 'Courier New', monospace;
          width: 100%;
          height: 200px;
          background-color: #0d0d0d;
          position: relative;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          border: 1px solid #333;
          border-radius: 6px;
        }
        
        .scanlines {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0),
            rgba(255, 255, 255, 0) 50%,
            rgba(0, 0, 0, 0.2) 50%,
            rgba(0, 0, 0, 0.2)
          );
          background-size: 100% 4px;
          z-index: 10;
          pointer-events: none;
        }

        @keyframes glitch {
          2%, 64% { transform: translate(2px,0) skew(0deg); }
          4%, 60% { transform: translate(-2px,0) skew(0deg); }
          62% { transform: translate(0,0) skew(5deg); }
        }

        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-5px); }
        }

        .title {
          font-size: 48px;
          font-weight: 900;
          text-transform: uppercase;
          position: relative;
          color: #fff;
          letter-spacing: 4px;
          z-index: 5;
          animation: float 4s ease-in-out infinite;
        }

        .title::before, .title::after {
          content: attr(data-text);
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
        }

        .title::before {
          left: 2px;
          text-shadow: -1px 0 #ff00de;
          clip: rect(24px, 550px, 90px, 0);
          animation: glitch 3s infinite linear alternate-reverse;
        }

        .title::after {
          left: -2px;
          text-shadow: -1px 0 #00ffff;
          clip: rect(85px, 550px, 140px, 0);
          animation: glitch 2s infinite linear alternate-reverse;
        }

        .color-bar {
          display: flex;
          gap: 15px;
          margin-top: 20px;
          z-index: 5;
        }

        .pill {
          padding: 5px 15px;
          font-size: 12px;
          font-weight: bold;
          border-radius: 4px;
          text-transform: uppercase;
          box-shadow: 0 0 10px currentColor;
          animation: pulse 2s infinite;
          background: rgba(0,0,0,0.4);
          border: 1px solid currentColor;
        }

        @keyframes pulse {
          0% { opacity: 0.7; box-shadow: 0 0 5px currentColor; }
          50% { opacity: 1; box-shadow: 0 0 15px currentColor; }
          100% { opacity: 0.7; box-shadow: 0 0 5px currentColor; }
        }

        .c-main { color: #FFFF00; }   /* Yellow */
        .c-pat { color: #9d8cff; }    /* Purple */
        .c-doc { color: #00ff00; }    /* Green */
        .c-ward { color: #ff69b4; }   /* Pink */

        .bg-glow {
          position: absolute;
          width: 600px;
          height: 600px;
          background: radial-gradient(circle, rgba(157, 140, 255, 0.1) 0%, rgba(0,0,0,0) 70%);
          animation: rotate 10s linear infinite;
          z-index: 1;
        }
        
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      </style>
      <div class="container">
        <div class="scanlines"></div>
        <div class="bg-glow"></div>
        
        <div class="title" data-text="NEKO'S HMS">NEKO'S HMS</div>
        
        <div class="color-bar">
          <div class="pill c-main">Hospital</div>
          <div class="pill c-pat">Patients</div>
          <div class="pill c-doc">Doctors</div>
          <div class="pill c-ward">Wards</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
